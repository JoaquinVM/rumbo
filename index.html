<title>Rumbo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a single phone-width column, a forward-looking hero (the trajectory), bottom tab bar. */
:root{
  --bg:#EDF0EA; --surface:#FFFFFF; --sunk:#E3E8E1; --ink:#13201A; --muted:#5D6B63; --line:#D3DBD4;
  --accent:#2B47E0; --accent-soft:#DDE3FF; --on-accent:#FFFFFF;
  --gain:#0F7A56; --loss:#C8432B; --warn:#A86B12;
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body:"Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1411; --surface:#17201B; --sunk:#111915; --ink:#E6EDE8; --muted:#94A39A; --line:#29352F;
  --accent:#8196FF; --accent-soft:#232C55; --on-accent:#0E1411;
  --gain:#4CC79A; --loss:#FF7C5F; --warn:#E6AE52; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0E1411; --surface:#17201B; --sunk:#111915; --ink:#E6EDE8; --muted:#94A39A; --line:#29352F;
  --accent:#8196FF; --accent-soft:#232C55; --on-accent:#0E1411;
  --gain:#4CC79A; --loss:#FF7C5F; --warn:#E6AE52; color-scheme:dark;}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.app{max-width:600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px calc(96px + env(safe-area-inset-bottom,0px))}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:6px 14px}
.brand{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.brand svg{width:22px;height:22px}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;width:38px;height:38px;display:grid;place-items:center}
.icon-btn svg{width:18px;height:18px}

.banner{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;justify-content:space-between;background:var(--accent-soft);border-radius:var(--r);padding:12px 14px;margin-bottom:16px;font-size:14px}
.banner b{font-weight:600}
.note{font-size:13px;color:var(--muted);padding:8px 2px}

.btn{border:0;border-radius:999px;padding:10px 16px;font-weight:600;background:var(--accent);color:var(--on-accent);transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--loss);color:var(--on-accent)}
.btn.small{padding:7px 12px;font-size:13px}
.link{background:none;border:0;padding:0;color:var(--accent);font-weight:600}

/* Hero */
.hero{padding-block:4px 6px}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.hero h1{font-size:clamp(28px,7.4vw,40px);line-height:1.08;font-weight:700;margin-top:6px}
.hero h1 .big{color:var(--accent);font-weight:800;white-space:nowrap}
.hero h1 .neg{color:var(--loss)}
.hero p{margin:10px 0 0;color:var(--muted);max-width:52ch}
.seg{display:inline-flex;background:var(--sunk);border-radius:999px;padding:3px;gap:2px;margin-top:14px}
.seg button{border:0;background:transparent;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}

.chart{margin-top:10px;width:100%;overflow:hidden}
.chart svg{display:block;width:100%;height:auto}
.chart .lbl{fill:var(--muted);font-size:11px;font-family:var(--body)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted);margin-top:4px}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:6px}

.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border-radius:var(--r);overflow:hidden;margin-top:18px;border:1px solid var(--line)}
.stat{background:var(--surface);padding:12px}
.stat .k{font-size:12px;color:var(--muted)}
.stat .v{font-family:var(--display);font-weight:700;font-size:22px;margin-top:2px}
.stat .s{font-size:12px;color:var(--muted)}
@media (max-width:420px){.stat .v{font-size:19px}.stat{padding:10px}}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-top:16px}
.card h2{font-size:18px;font-weight:700}
.card .sub{color:var(--muted);font-size:13px;margin-top:2px}

.meter{height:10px;background:var(--sunk);border-radius:99px;overflow:hidden;display:flex;margin-top:12px}
.meter span{display:block;height:100%}
.meter-key{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted);margin-top:8px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle}
.today{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-top:10px}
.today .v{font-family:var(--display);font-size:30px;font-weight:800}

/* What-if */
.wi{display:grid;gap:14px;margin-top:14px}
.wi-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center}
.wi-row label{font-size:14px}
.wi-row output{font-size:13px;color:var(--muted);text-align:right}
.wi-row input[type=range]{grid-column:1/-1;width:100%;accent-color:var(--accent)}
.wi-result{margin-top:14px;padding:12px;border-radius:10px;background:var(--accent-soft);font-size:14px}
.wi-result b{font-family:var(--display);font-size:20px}

/* Lists */
.month-nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:4px}
.month-nav h1{font-size:26px;font-weight:700;text-align:center}
.totals{display:flex;gap:18px;flex-wrap:wrap;margin-top:8px;font-size:13px;color:var(--muted)}
.totals b{color:var(--ink);font-weight:600}
.day{margin-top:18px}
.day-h{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600;padding-inline:2px}
.rows{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-top:6px;overflow:hidden}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 14px;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.row:first-child{border-top:0}
.row:hover{background:var(--sunk)}
.badge{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:14px;color:#fff}
.row .t{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .m{font-size:12px;color:var(--muted)}
.amt{font-weight:600}
.amt.in{color:var(--gain)}
.empty{text-align:center;padding:36px 16px;color:var(--muted)}
.empty h3{color:var(--ink);font-size:18px;margin-bottom:6px}

/* Breakdown */
.bd{display:grid;gap:14px;margin-top:14px}
.bd-item .top{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.bd-item .bar{height:8px;border-radius:99px;background:var(--sunk);margin-top:6px;overflow:hidden}
.bd-item .bar span{display:block;height:100%;border-radius:99px}
.bd-item .meta{font-size:12px;color:var(--muted);margin-top:4px}

/* Tabbar + FAB */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 10px;font-size:11px;font-weight:600;color:var(--muted);text-decoration:none}
nav.tabs a svg{width:22px;height:22px}
nav.tabs a[aria-current="page"]{color:var(--accent)}
.fab{position:fixed;z-index:21;right:max(18px,calc(50% - 282px));bottom:calc(74px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:20px;border:0;background:var(--accent);color:var(--on-accent);box-shadow:0 8px 24px rgba(30,50,160,.32);display:grid;place-items:center;transition:transform .15s}
.fab:active{transform:scale(.94)}
.fab svg{width:26px;height:26px}

/* Sheet */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(8,14,11,.42);display:flex;align-items:flex-end;justify-content:center;animation:fade .18s ease}
.sheet{background:var(--surface);width:100%;max-width:600px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));animation:up .24s cubic-bezier(.2,.8,.2,1)}
.sheet h2{font-size:20px;font-weight:700}
.grab{width:40px;height:4px;border-radius:9px;background:var(--line);margin:0 auto 14px}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@keyframes fade{from{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.field{display:grid;gap:6px;margin-top:14px}
.field label{font-size:13px;color:var(--muted);font-weight:500}
.field input,.field select{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:11px 12px;width:100%}
.amount-in{font-family:var(--display);font-size:40px!important;font-weight:800;padding:8px 12px!important;text-align:left}
.toggle{display:grid;grid-template-columns:1fr 1fr;background:var(--sunk);border-radius:12px;padding:3px;margin-top:12px}
.toggle button{border:0;background:transparent;border-radius:10px;padding:9px;font-weight:600;color:var(--muted)}
.toggle button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:500;display:inline-flex;align-items:center}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:20px;flex-wrap:wrap}
.actions .r{display:flex;gap:10px;margin-left:auto}
.hint{font-size:12px;color:var(--muted);margin-top:4px}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;z-index:60;animation:fade .2s}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;margin-top:22px}
.sec-h h2{font-size:18px}
</style>

<div class="app" id="app">
  <header class="top">
    <div class="brand"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/><path d="M15.5 8.5l-2 5-5 2 2-5 5-2z" fill="var(--accent)"/></svg>Rumbo</div>
    <button class="icon-btn" id="btnSettings" aria-label="Ajustes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
  </header>
  <div id="banner"></div>
  <main id="view"><div class="empty"><h3>Cargando tu rumbo…</h3>Abriendo tus datos guardados.</div></main>
</div>

<button class="fab" id="fab" aria-label="Anotar movimiento"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>

<nav class="tabs" aria-label="Secciones"><div class="in">
  <a href="#rumbo" data-v="rumbo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5-5 4 3 8-8"/><path d="M15 7h5v5"/></svg>Rumbo</a>
  <a href="#movimientos" data-v="movimientos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 6h14M5 12h14M5 18h9"/></svg>Movimientos</a>
  <a href="#desglose" data-v="desglose"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8"/><path d="M12 4v8l6 5"/></svg>Desglose</a>
  <a href="#fijos" data-v="fijos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>Fijos</a>
</div></nav>

<div id="sheetRoot"></div>

<script>
(() => {
/* ---------- Catálogo ---------- */
const CATS = {
  gasto: [
    {id:'comida', n:'Comida fuera', c:'#E0703A'}, {id:'super', n:'Súper', c:'#3E9B5C'},
    {id:'casa', n:'Casa', c:'#5A6CD8'}, {id:'transporte', n:'Transporte', c:'#2F93B5'},
    {id:'salud', n:'Salud', c:'#D04F78'}, {id:'ocio', n:'Ocio', c:'#9A5BD0'},
    {id:'compras', n:'Compras', c:'#C08A1F'}, {id:'suscripciones', n:'Suscripciones', c:'#6B7F8C'},
    {id:'educacion', n:'Educación', c:'#2E8F86'}, {id:'deudas', n:'Deudas', c:'#B5482E'},
    {id:'otros', n:'Otros', c:'#808A84'}
  ],
  ingreso: [
    {id:'sueldo', n:'Sueldo', c:'#1E8A5E'}, {id:'extra', n:'Extra', c:'#2E9C84'},
    {id:'ventas', n:'Ventas', c:'#4A8F3A'}, {id:'otros_i', n:'Otros', c:'#6A8A7A'}
  ]
};
const CAT = Object.fromEntries([...CATS.gasto, ...CATS.ingreso].map(c => [c.id, c]));
const CURRENCIES = [['MXN','Peso mexicano'],['USD','Dólar'],['EUR','Euro'],['COP','Peso colombiano'],['ARS','Peso argentino'],['CLP','Peso chileno'],['PEN','Sol'],['GTQ','Quetzal']];
const DEFAULT_SETTINGS = {currency:'MXN', patrimonio:0, rendimiento:5, metaAhorro:0, horasMes:160, onboarded:true};

/* ---------- Utilidades ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseISO = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const todayISO = () => iso(new Date());
const monthKey = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}`;
const sum = (a, f = x => x) => a.reduce((t, x) => t + f(x), 0);
// Reads amounts as people type them: "1.500" and "1,500" are 1500; "12,50", "1.500,50" and "1,500.50" keep decimals.
const parseAmt = v => {
  let s = String(v).replace(/[^\d.,]/g, '');
  const dot = s.lastIndexOf('.'), com = s.lastIndexOf(',');
  if (dot >= 0 && com >= 0) {
    const dec = dot > com ? '.' : ',';
    s = s.split(dec === '.' ? ',' : '.').join('').replace(dec, '.');
  } else if (dot >= 0 || com >= 0) {
    const parts = s.split(dot >= 0 ? '.' : ',');
    const thousands = parts.length > 2 || (parts[parts.length - 1].length === 3 && parts[0] !== '0' && parts[0] !== '');
    s = thousands ? parts.join('') : parts.join('.');
  }
  const n = parseFloat(s); return isFinite(n) ? n : 0;
};
let fmtCache = {};
function money(n, opt = {}) {
  const cur = S.settings.currency || 'MXN';
  const key = cur + (opt.compact ? 'c' : '') + (opt.sign ? 's' : '');
  if (!fmtCache[key]) fmtCache[key] = new Intl.NumberFormat('es-MX', {style:'currency', currency:cur, maximumFractionDigits: opt.compact ? 1 : 0, notation: opt.compact ? 'compact' : 'standard', signDisplay: opt.sign ? 'exceptZero' : 'auto'});
  return fmtCache[key].format(Math.round(n));
}
const monthName = (d, withYear = true) => { const t = d.toLocaleDateString('es-MX', withYear ? {month:'long', year:'numeric'} : {month:'long'}); return t[0].toUpperCase() + t.slice(1); };
const shortMonth = d => d.toLocaleDateString('es-MX', {month:'short', year:'numeric'}).replace('.', '');

/* ---------- Estado ---------- */
let S = {settings:{...DEFAULT_SETTINGS}, fijos:[], movs:[]};
let demo = false, demoS = null, loaded = false;
let store = null;
const ui = {horizon: 5, month: monthKey(new Date()), wi: {}, wiExtra: 0};

function makeDemo() {
  const t = new Date(); const movs = [];
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const r = (a, b) => Math.round((a + rnd() * (b - a)) / 10) * 10;
  for (let i = 0; i < 80; i++) {
    const d = new Date(t); d.setDate(t.getDate() - i); const f = iso(d), wd = d.getDay();
    if (rnd() < .55) movs.push({id:'d'+i+'a', fecha:f, tipo:'gasto', cat:'comida', monto:r(120, 420), nota:['Tacos','Café','Comida con equipo','Pizza'][i%4]});
    if (wd === 6) movs.push({id:'d'+i+'b', fecha:f, tipo:'gasto', cat:'super', monto:r(900, 1600), nota:'Súper de la semana'});
    if (rnd() < .4) movs.push({id:'d'+i+'c', fecha:f, tipo:'gasto', cat:'transporte', monto:r(70, 260), nota:['Uber','Gasolina','Metro'][i%3]});
    if (wd === 5 && rnd() < .8) movs.push({id:'d'+i+'d', fecha:f, tipo:'gasto', cat:'ocio', monto:r(350, 1300), nota:['Cine y cena','Salida con amigos','Concierto'][i%3]});
    if (rnd() < .07) movs.push({id:'d'+i+'e', fecha:f, tipo:'gasto', cat:'compras', monto:r(500, 2400), nota:['Ropa','Audífonos','Regalo'][i%3]});
    if (i === 23) movs.push({id:'d'+i+'f', fecha:f, tipo:'ingreso', cat:'extra', monto:4500, nota:'Proyecto freelance'});
    if (i === 41) movs.push({id:'d'+i+'g', fecha:f, tipo:'gasto', cat:'salud', monto:850, nota:'Consulta'});
  }
  return {
    settings:{currency:'MXN', patrimonio:45000, rendimiento:5, metaAhorro:3000, horasMes:160, onboarded:false},
    fijos:[
      {id:'f1', nombre:'Sueldo', monto:32000, tipo:'ingreso', cat:'sueldo'},
      {id:'f2', nombre:'Renta', monto:9500, tipo:'gasto', cat:'casa'},
      {id:'f3', nombre:'Internet y celular', monto:900, tipo:'gasto', cat:'casa'},
      {id:'f4', nombre:'Gimnasio', monto:650, tipo:'gasto', cat:'salud'},
      {id:'f5', nombre:'Streaming', monto:380, tipo:'gasto', cat:'suscripciones'}
    ], movs
  };
}

/* ---------- Modelo: el ritmo actual ---------- */
function baseline() {
  const fijIng = sum(S.fijos.filter(f => f.tipo === 'ingreso'), f => f.monto);
  const fijGas = sum(S.fijos.filter(f => f.tipo === 'gasto'), f => f.monto);
  const now = new Date(); const from = new Date(now); from.setDate(now.getDate() - 90);
  const win = S.movs.filter(m => parseISO(m.fecha) >= from && parseISO(m.fecha) <= now);
  let months = 1;
  if (win.length) {
    const first = Math.min(...win.map(m => parseISO(m.fecha).getTime()));
    months = Math.min(3, Math.max(1, ((now - first) / 864e5 + 1) / 30.44));
  }
  const varCat = {};
  win.filter(m => m.tipo === 'gasto').forEach(m => varCat[m.cat] = (varCat[m.cat] || 0) + m.monto / months);
  const varIng = sum(win.filter(m => m.tipo === 'ingreso'), m => m.monto) / months;
  const fijCat = {};
  S.fijos.filter(f => f.tipo === 'gasto').forEach(f => fijCat[f.cat] = (fijCat[f.cat] || 0) + f.monto);
  const varGas = sum(Object.values(varCat));
  const ingreso = fijIng + varIng, gasto = fijGas + varGas;
  return {fijIng, fijGas, varIng, varGas, varCat, fijCat, ingreso, gasto, neto: ingreso - gasto, months};
}
function project(start, neto, rate, months) {
  const out = [start]; let b = start; const rm = rate / 100 / 12;
  for (let i = 1; i <= months; i++) { b = b + (b > 0 ? b * rm : 0) + neto; out.push(b); }
  return out;
}
function whatIfNeto(B) {
  let saved = 0;
  for (const [cat, pct] of Object.entries(ui.wi)) saved += (B.varCat[cat] || 0) * pct / 100;
  return {neto: B.neto + saved + (ui.wiExtra || 0), saved};
}
function monthData(key) {
  const ms = S.movs.filter(m => m.fecha.slice(0, 7) === key);
  const B = baseline();
  const varGas = sum(ms.filter(m => m.tipo === 'gasto'), m => m.monto);
  const varIng = sum(ms.filter(m => m.tipo === 'ingreso'), m => m.monto);
  return {ms, varGas, varIng, ingreso: B.fijIng + varIng, gasto: B.fijGas + varGas, B};
}

/* ---------- Almacenamiento ---------- */
const LS_KEY = 'rumbo-v1';
function localStore() {
  let saved = null; try { saved = JSON.parse(localStorage.getItem(LS_KEY) || 'null'); } catch (e) {}
  const persist = () => { try { localStorage.setItem(LS_KEY, JSON.stringify({settings:S.settings, fijos:S.fijos, movs:S.movs})); } catch (e) {} };
  return {kind:'local', initial: saved, saveMain: persist, saveMov: persist, delMov: persist, clear: () => { try { localStorage.removeItem(LS_KEY); } catch (e) {} }};
}
async function initStore() {
  let db = null, user = null, id = null;
  const timer = setTimeout(() => { if (!loaded) { $('#banner').innerHTML = '<div class="note">Tus datos aún no responden. Revisa tu conexión; esta página sigue intentando.</div>'; } }, 10000);
  try { if (window.claude?.use) [db, user] = await Promise.all([claude.use('db'), claude.use('user')]); } catch (e) {}
  try { id = user ? await user.id() : null; } catch (e) {}
  if (db && id) {
    const mainRef = db.doc(`data/users/${id}/rumbo`);
    const movsRef = mainRef.collection('movs');
    let main, movs, gotMain = false, gotMovs = false;
    const sync = () => {
      if (!gotMain || !gotMovs) return;
      clearTimeout(timer);
      if (!loaded) { loaded = true; $('#banner').innerHTML = ''; }
      if (main && main.settings && main.settings.onboarded) {
        demo = false;
        S = {settings:{...DEFAULT_SETTINGS, ...main.settings}, fijos: main.fijos || [], movs};
      } else { demo = true; S = demoS || (demoS = makeDemo()); }
      fmtCache = {}; render();
    };
    const onErr = () => { clearTimeout(timer); $('#banner').innerHTML = '<div class="note">No pude abrir tus datos guardados en esta visita. Puedes explorar el ejemplo.</div>'; if (!loaded) { loaded = true; demo = true; S = demoS || (demoS = makeDemo()); render(); } };
    mainRef.onSnapshot(s => { main = s.exists ? s.data() : null; gotMain = true; sync(); }, onErr);
    movsRef.onSnapshot(q => { movs = q.docs.map(d => ({...d.data(), id: d.id})); gotMovs = true; sync(); }, onErr);
    let chain = Promise.resolve(), pending = false;
    const saveMain = () => { if (pending) return; pending = true; chain = chain.then(async () => { pending = false; try { await mainRef.set({settings:S.settings, fijos:S.fijos}); } catch (e) { toast('No se pudo guardar. Intenta de nuevo.'); } }); };
    store = {
      kind:'cloud', saveMain,
      saveMov: m => movsRef.doc(m.id).set({fecha:m.fecha, tipo:m.tipo, cat:m.cat, monto:m.monto, nota:m.nota || ''}).catch(() => toast('No se pudo guardar el movimiento.')),
      delMov: idm => movsRef.doc(idm).delete().catch(() => toast('No se pudo borrar.')),
      clear: async () => { for (const m of S.movs) { try { await movsRef.doc(m.id).delete(); } catch (e) {} } try { await mainRef.delete(); } catch (e) {} }
    };
  } else {
    clearTimeout(timer);
    store = localStore(); loaded = true;
    if (store.initial && store.initial.settings && store.initial.settings.onboarded) {
      S = {settings:{...DEFAULT_SETTINGS, ...store.initial.settings}, fijos: store.initial.fijos || [], movs: store.initial.movs || []};
    } else { demo = true; S = demoS = makeDemo(); }
    $('#banner').dataset.local = '1';
    render();
  }
}
function commitMain() { if (!demo) store.saveMain(); }

/* ---------- Gráfica ---------- */
function niceStep(range) { const raw = range / 4; const p = Math.pow(10, Math.floor(Math.log10(raw || 1))); const f = raw / p; return (f < 1.5 ? 1 : f < 3 ? 2 : f < 7 ? 5 : 10) * p; }
function chartSVG(series, months) {
  const W = 600, H = 250, L = 58, R = 14, T = 14, Bm = 28;
  const all = series.flatMap(s => s.data);
  let lo = Math.min(0, ...all), hi = Math.max(0, ...all);
  if (hi === lo) hi = lo + 1;
  const step = niceStep(hi - lo); lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step;
  const x = i => L + (W - L - R) * i / months, y = v => T + (H - T - Bm) * (hi - v) / (hi - lo);
  let g = '';
  for (let v = lo; v <= hi + step / 2; v += step) {
    g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="${v === 0 ? 1.5 : 1}" ${v === 0 ? '' : 'stroke-dasharray="2 4"'}/>`;
    g += `<text class="lbl num" x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${money(v, {compact:true})}</text>`;
  }
  const years = months / 12, yStep = years <= 1 ? 0.25 : years <= 5 ? 1 : years <= 10 ? 2 : 5;
  const now = new Date();
  for (let yr = 0; yr <= years + 1e-9; yr += yStep) {
    const i = Math.round(yr * 12);
    const d = new Date(now.getFullYear(), now.getMonth() + i, 1);
    const label = yr === 0 ? 'Hoy' : years <= 1 ? d.toLocaleDateString('es-MX', {month:'short'}).replace('.', '') : String(d.getFullYear());
    g += `<text class="lbl" x="${x(i)}" y="${H - 8}" text-anchor="${yr === 0 ? 'start' : i === months ? 'end' : 'middle'}">${label}</text>`;
  }
  series.forEach(s => {
    const pts = s.data.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
    if (s.fill) g += `<polygon points="${x(0)},${y(Math.max(lo, 0))} ${pts} ${x(months)},${y(Math.max(lo, 0))}" fill="${s.color}" opacity=".12"/>`;
    g += `<polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="${s.w || 2.5}" stroke-linejoin="round" stroke-linecap="round" ${s.dash ? 'stroke-dasharray="6 5"' : ''}/>`;
    const last = s.data[s.data.length - 1];
    g += `<circle cx="${x(months)}" cy="${y(last)}" r="4.5" fill="${s.color}" stroke="var(--surface)" stroke-width="2"/>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Proyección de tu patrimonio">${g}</svg>`;
}

/* ---------- Vistas ---------- */
function vRumbo() {
  const B = baseline(), st = S.settings, months = ui.horizon * 12;
  const base = project(st.patrimonio, B.neto, st.rendimiento, months);
  const W = whatIfNeto(B), hasWI = W.neto !== B.neto;
  const alt = hasWI ? project(st.patrimonio, W.neto, st.rendimiento, months) : null;
  const end = base[months];
  const zeroIdx = base.findIndex(v => v < 0);
  const tasa = B.ingreso > 0 ? B.neto / B.ingreso : 0;
  const libertad = B.gasto > 0 ? Math.max(0, st.patrimonio) / B.gasto : 0;
  const horizonTxt = ui.horizon === 1 ? 'un año' : `${ui.horizon} años`;
  let headline, sub;
  if (zeroIdx > 0) {
    const d = new Date(); d.setMonth(d.getMonth() + zeroIdx);
    headline = `A este ritmo, tus ahorros se acaban en <span class="big neg">${shortMonth(d)}</span>.`;
    sub = `Cada mes sale ${money(-B.neto)} más de lo que entra. Mueve las palancas de abajo para ver qué lo cambia.`;
  } else if (st.patrimonio <= 0 && B.neto < 0) {
    headline = `A este ritmo, en ${horizonTxt} deberías <span class="big neg">${money(-end)}</span>.`;
    sub = `Cada mes sale ${money(-B.neto)} más de lo que entra.`;
  } else {
    headline = `A este ritmo, en ${horizonTxt} tendrás <span class="big">${money(end)}</span>.`;
    const crece = end - st.patrimonio - B.neto * months;
    sub = `Ahorras ${money(B.neto)} al mes${crece > 1 ? `, y el rendimiento suma ${money(crece)} más` : ''}. Hoy tienes ${money(st.patrimonio)}.`;
  }
  const series = [{data: base, color: B.neto >= 0 ? 'var(--accent)' : 'var(--loss)', fill: true}];
  if (alt) series.push({data: alt, color: 'var(--gain)', dash: true, w: 2.5});

  // Este mes
  const mk = monthKey(new Date()), md = monthData(mk);
  const now = new Date(), dim = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate(), left = dim - now.getDate() + 1;
  const libre = md.ingreso - B.fijGas - (st.metaAhorro || 0) - md.varGas;
  const tot = Math.max(md.ingreso, B.fijGas + (st.metaAhorro || 0) + md.varGas, 1);
  const seg = (v, c) => `<span style="width:${Math.max(0, v) / tot * 100}%;background:${c}"></span>`;

  // Palancas: top categorías variables
  const top = Object.entries(B.varCat).sort((a, b) => b[1] - a[1]).slice(0, 4);
  const altEnd = alt ? alt[months] : end;
  const diff = altEnd - end;

  return `
  <section class="hero">
    <div class="eyebrow">Tu rumbo</div>
    <h1>${headline}</h1>
    <p>${sub}</p>
    <div class="seg" role="group" aria-label="Horizonte">${[1, 5, 10, 20].map(h => `<button data-h="${h}" aria-pressed="${ui.horizon === h}">${h} ${h === 1 ? 'año' : 'años'}</button>`).join('')}</div>
    <div class="chart" id="chartBox">${chartSVG(series, months)}</div>
    <div class="legend" id="legend"><span><i style="background:${series[0].color}"></i>Si sigues igual</span>${alt ? `<span><i style="background:var(--gain)"></i>Con tus ajustes</span>` : ''}<span>Rendimiento ${st.rendimiento}% anual</span></div>
  </section>

  <div class="stats">
    <div class="stat"><div class="k">Tasa de ahorro</div><div class="v num" style="color:${tasa < 0 ? 'var(--loss)' : tasa >= .2 ? 'var(--gain)' : 'var(--ink)'}">${Math.round(tasa * 100)}%</div><div class="s">de lo que ganas</div></div>
    <div class="stat"><div class="k">Colchón</div><div class="v num">${libertad >= 99 ? '99+' : libertad.toFixed(1)}</div><div class="s">meses sin ingresos</div></div>
    <div class="stat"><div class="k">Al mes</div><div class="v num" style="color:${B.neto < 0 ? 'var(--loss)' : 'var(--ink)'}">${money(B.neto, {compact: Math.abs(B.neto) >= 100000, sign:true})}</div><div class="s">${money(B.ingreso, {compact:true})} entra · ${money(B.gasto, {compact:true})} sale</div></div>
  </div>

  <section class="card">
    <h2>Este mes</h2>
    <div class="sub">Lo que te queda para gastos variables${st.metaAhorro ? `, ya apartado tu ahorro de ${money(st.metaAhorro)}` : ''}.</div>
    <div class="today"><span class="v num" style="color:${libre < 0 ? 'var(--loss)' : 'var(--ink)'}">${money(libre)}</span><span class="note">${libre > 0 ? `≈ ${money(libre / left)} al día por ${left} ${left === 1 ? 'día' : 'días'}` : 'ya gastaste más de lo disponible'}</span></div>
    <div class="meter" aria-hidden="true">${seg(B.fijGas, 'var(--ink)')}${seg(st.metaAhorro || 0, 'var(--gain)')}${seg(md.varGas, 'var(--warn)')}${seg(libre, 'var(--accent-soft)')}</div>
    <div class="meter-key"><span><i class="dot" style="background:var(--ink)"></i>Fijos ${money(B.fijGas)}</span>${st.metaAhorro ? `<span><i class="dot" style="background:var(--gain)"></i>Ahorro ${money(st.metaAhorro)}</span>` : ''}<span><i class="dot" style="background:var(--warn)"></i>Variable ${money(md.varGas)}</span><span><i class="dot" style="background:var(--accent-soft);outline:1px solid var(--line)"></i>Libre</span></div>
  </section>

  <section class="card">
    <h2>¿Y si…?</h2>
    <div class="sub">Mueve una palanca y mira cómo cambia la línea de arriba.</div>
    ${top.length ? '' : '<p class="note">Anota algunos gastos variables y aquí aparecerán tus categorías más grandes.</p>'}
    <div class="wi">
      ${top.map(([cat, v]) => { const p = ui.wi[cat] || 0; return `<div class="wi-row"><label for="wi-${cat}">Gastar menos en ${CAT[cat]?.n.toLowerCase() || cat}</label><output>${p ? `−${p}% · ${money(v * p / 100)}/mes` : `${money(v)}/mes`}</output><input type="range" id="wi-${cat}" data-wi="${cat}" min="0" max="60" step="5" value="${p}"></div>`; }).join('')}
      <div class="wi-row"><label for="wi-extra">Ingreso extra al mes</label><output>${money(ui.wiExtra || 0, {sign:true})}</output><input type="range" id="wi-extra" min="0" max="${Math.max(5000, Math.round(B.ingreso * .5 / 500) * 500)}" step="${B.ingreso > 50000 ? 1000 : 250}" value="${ui.wiExtra || 0}"></div>
    </div>
    <div id="wiResultBox">${alt ? `<div class="wi-result">En ${horizonTxt} tendrías <b class="num">${money(altEnd)}</b>, ${money(diff, {sign:true})} frente a seguir igual. <button class="link" id="wiReset">Quitar ajustes</button></div>` : ''}</div>
  </section>`;
}

function vMovs() {

  const md = monthData(ui.month);

}

function vDesglose() {
  const [y, m] = ui.month.split('-').map(Number), d = new Date(y, m - 1, 1);
  const md = monthData(ui.month), B = md.B, st = S.settings;
  const cats = {};
  S.fijos.filter(f => f.tipo === 'gasto').forEach(f => (cats[f.cat] ||= {fijo:0, varb:0}).fijo += f.monto);
  md.ms.filter(x => x.tipo === 'gasto').forEach(x => (cats[x.cat] ||= {fijo:0, varb:0}).varb += x.monto);
  const list = Object.entries(cats).map(([k, v]) => ({k, ...v, t: v.fijo + v.varb})).sort((a, b) => b.t - a.t);

  <div class="totals"><span>Entró <b class="num">${money(md.ingreso)}</b></span><span>Salió <b class="num">${money(md.gasto)}</b></span><span>Quedó <b class="num" style="color:${ahorro < 0 ? 'var(--loss)' : 'var(--gain)'}">${money(ahorro)}</b></span></div>
  <section class="card">
    <h2>A dónde se va cada ${money(100)}</h2>

    <div class="meter" style="height:14px">${list.map(l => `<span style="width:${l.t / Math.max(ing, md.gasto) * 100}%;background:${CAT[l.k]?.c || '#888'}"></span>`).join('')}${ahorro > 0 ? `<span style="width:${ahorro / ing * 100}%;background:var(--gain);opacity:.35"></span>` : ''}</div>
    <div class="bd">

    : '<p class="note">Sin gastos este mes todavía.</p>'}
    ${ahorro > 0 ? `<div class="bd-item"><div class="top"><span><i class="dot" style="background:var(--gain)"></i>Te quedas tú</span><span class="num"><b>${money(ahorro)}</b></span></div><div class="meta num">${money(ahorro / ing * 100)} de cada ${money(100)}</div></div>` : ''}

/* ---------- Eventos ---------- */

  else if (t.id === 'wiReset') { ui.wi = {}; ui.wiExtra = 0; render(); }
  else if (t.id === 'btnStart') openOnboarding();
  else if (t.id === 'fab') openMov(null);
  else if (t.id === 'btnSettings') openSettings();
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.wi || t.id === 'wi-extra') {
    if (t.dataset.wi) ui.wi[t.dataset.wi] = +t.value; else ui.wiExtra = +t.value;
    patchRumbo();
  }
});

function patchRumbo() {
  const tmp = document.createElement('div'); tmp.innerHTML = vRumbo();
  ['#chartBox', '#legend', '#wiResultBox'].forEach(sel => { const a = document.querySelector('#view ' + sel), b = tmp.querySelector(sel); if (a && b) a.innerHTML = b.innerHTML; });
  const now = document.querySelectorAll('#view .wi-row output');
  tmp.querySelectorAll('.wi-row output').forEach((o, i) => { if (now[i]) now[i].textContent = o.textContent; });
}

/* ---------- Hojas ---------- */
function openSheet(html, mount) {
  const root = $('#sheetRoot');
  root.innerHTML = `<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div></div>`;
  const scrim = $('#scrim');
  scrim.addEventListener('click', e => { if (e.target === scrim) closeSheet(); });
  root.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', closeSheet));
  mount && mount(root.querySelector('.sheet'));
}
function closeSheet() { $('#sheetRoot').innerHTML = ''; }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });
function toast(msg) { const d = document.createElement('div'); d.className = 'toast'; d.textContent = msg; document.body.appendChild(d); setTimeout(() => d.remove(), 2200); }
function chipsHTML(tipo, sel) { return CATS[tipo].map(c => `<button type="button" class="chip" data-cat="${c.id}" aria-pressed="${c.id === sel}"><i class="dot" style="background:${c.c}"></i>${c.n}</button>`).join(''); }
function wireTipo(sh, state, onChange) {
  sh.querySelectorAll('[data-tipo]').forEach(b => b.addEventListener('click', () => {
    state.tipo = b.dataset.tipo; state.cat = CATS[state.tipo][0].id;
    sh.querySelectorAll('[data-tipo]').forEach(x => x.setAttribute('aria-pressed', x.dataset.tipo === state.tipo));
    sh.querySelector('.chips').innerHTML = chipsHTML(state.tipo, state.cat); onChange && onChange();
  }));
  sh.querySelector('.chips').addEventListener('click', e => { const c = e.target.closest('[data-cat]'); if (!c) return; state.cat = c.dataset.cat; sh.querySelectorAll('[data-cat]').forEach(x => x.setAttribute('aria-pressed', x.dataset.cat === state.cat)); });
}

function openMov(mov) {
  const st = mov ? {...mov} : {id: uid(), tipo:'gasto', cat:'comida', fecha: todayISO(), monto: 0, nota:''};
  openSheet(`
    <h2>${mov ? 'Editar movimiento' : 'Anotar'}</h2>
    <form id="fm" autocomplete="off">
      <div class="toggle" role="group"><button type="button" data-tipo="gasto" aria-pressed="${st.tipo === 'gasto'}">Gasto</button><button type="button" data-tipo="ingreso" aria-pressed="${st.tipo === 'ingreso'}">Ingreso</button></div>
      <div class="field"><label for="m-monto">Monto (${S.settings.currency})</label><input id="m-monto" class="amount-in num" inputmode="decimal" placeholder="0" value="${st.monto || ''}" required></div>
      <div class="field"><label>Categoría</label><div class="chips">${chipsHTML(st.tipo, st.cat)}</div></div>
      <div class="two"><div class="field"><label for="m-nota">Nota</label><input id="m-nota" placeholder="Opcional" value="${esc(st.nota)}" maxlength="60"></div>
      <div class="field"><label for="m-fecha">Fecha</label><input id="m-fecha" type="date" value="${st.fecha}" required></div></div>
      <div class="actions">${mov ? '<button type="button" class="btn ghost" id="m-del">Borrar</button>' : ''}<div class="r"><button type="button" class="btn ghost" data-close>Cancelar</button><button class="btn" type="submit">Guardar</button></div></div>
    </form>`, sh => {
    wireTipo(sh, st);
    const amt = sh.querySelector('#m-monto'); setTimeout(() => amt.focus(), 60);
    const del = sh.querySelector('#m-del');
    if (del) del.addEventListener('click', () => {
      if (del.dataset.armed) { S.movs = S.movs.filter(x => x.id !== st.id); if (!demo) store.delMov(st.id); closeSheet(); render(); toast('Movimiento borrado'); }
      else { del.dataset.armed = '1'; del.textContent = 'Toca otra vez para borrar'; del.className = 'btn danger'; }
    });
    sh.querySelector('#fm').addEventListener('submit', e => {
      e.preventDefault();
      const monto = parseAmt(amt.value); if (!monto) { amt.focus(); toast('Escribe un monto'); return; }
      const m = {id: st.id, tipo: st.tipo, cat: st.cat, monto, nota: sh.querySelector('#m-nota').value.trim(), fecha: sh.querySelector('#m-fecha').value || todayISO()};
      const i = S.movs.findIndex(x => x.id === m.id); if (i >= 0) S.movs[i] = m; else S.movs.push(m);
      if (!demo) store.saveMov(m);
      closeSheet(); render(); toast(mov ? 'Guardado' : `${m.tipo === 'gasto' ? 'Gasto' : 'Ingreso'} anotado`);
    });
  });
}

function openFijo(f, tipoNew) {
  const st = f ? {...f} : {id: uid(), tipo: tipoNew || 'gasto', cat: CATS[tipoNew || 'gasto'][0].id, nombre:'', monto:0};
  openSheet(`
    <h2>${f ? 'Editar fijo' : 'Nuevo fijo'}</h2>
    <form id="ff" autocomplete="off">
      <div class="toggle" role="group"><button type="button" data-tipo="gasto" aria-pressed="${st.tipo === 'gasto'}">Gasto</button><button type="button" data-tipo="ingreso" aria-pressed="${st.tipo === 'ingreso'}">Ingreso</button></div>
      <div class="field"><label for="f-nombre">Nombre</label><input id="f-nombre" placeholder="Renta, sueldo, Netflix…" value="${esc(st.nombre)}" required maxlength="40"></div>
      <div class="field"><label for="f-monto">Monto al mes (${S.settings.currency})</label><input id="f-monto" class="amount-in num" inputmode="decimal" placeholder="0" value="${st.monto || ''}" required></div>
      <div class="field"><label>Categoría</label><div class="chips">${chipsHTML(st.tipo, st.cat)}</div></div>
      <div class="actions">${f ? '<button type="button" class="btn ghost" id="f-del">Quitar</button>' : ''}<div class="r"><button type="button" class="btn ghost" data-close>Cancelar</button><button class="btn" type="submit">Guardar</button></div></div>
    </form>`, sh => {
    wireTipo(sh, st);
    setTimeout(() => sh.querySelector('#f-nombre').focus(), 60);
    const del = sh.querySelector('#f-del');
    if (del) del.addEventListener('click', () => {
      if (del.dataset.armed) { S.fijos = S.fijos.filter(x => x.id !== st.id); commitMain(); closeSheet(); render(); toast('Fijo quitado'); }
      else { del.dataset.armed = '1'; del.textContent = 'Toca otra vez para quitar'; del.className = 'btn danger'; }
    });
    sh.querySelector('#ff').addEventListener('submit', e => {
      e.preventDefault();
      const monto = parseAmt(sh.querySelector('#f-monto').value), nombre = sh.querySelector('#f-nombre').value.trim();
      if (!monto || !nombre) { toast('Falta nombre o monto'); return; }
      const nf = {id: st.id, tipo: st.tipo, cat: st.cat, nombre, monto};
      const i = S.fijos.findIndex(x => x.id === nf.id); if (i >= 0) S.fijos[i] = nf; else S.fijos.push(nf);
      commitMain(); closeSheet(); render(); toast('Guardado');
    });
  });
}

function settingsFields(s) {
  return `
    <div class="field"><label for="s-cur">Moneda</label><select id="s-cur">${CURRENCIES.map(([c, n]) => `<option value="${c}" ${c === s.currency ? 'selected' : ''}>${n} (${c})</option>`).join('')}</select></div>
    <div class="field"><label for="s-pat">Lo que tienes hoy</label><input id="s-pat" class="num" inputmode="decimal" value="${s.patrimonio || ''}" placeholder="0"><div class="hint">Ahorros + cuentas + inversiones, menos deudas. Es el punto de partida de tu rumbo. Si debes más de lo que tienes, ponlo con signo menos.</div></div>`;
}
function readPat(v) { const neg = /^\s*-/.test(v); const n = parseAmt(v); return neg ? -n : n; }

function openSettings() {
  const s = S.settings;
  openSheet(`
    <h2>Ajustes</h2>
    <form id="fs">
      ${settingsFields(s)}
      <div class="two">
        <div class="field"><label for="s-meta">Ahorro que apartas al mes</label><input id="s-meta" class="num" inputmode="decimal" value="${s.metaAhorro || ''}" placeholder="0"></div>
        <div class="field"><label for="s-rend">Rendimiento anual %</label><input id="s-rend" class="num" inputmode="decimal" value="${s.rendimiento}"></div>
      </div>
      <div class="field"><label for="s-horas">Horas que trabajas al mes</label><input id="s-horas" class="num" inputmode="numeric" value="${s.horasMes || ''}" placeholder="160"><div class="hint">Sirve para mostrar cuántas horas de trabajo cuesta cada gasto. Déjalo vacío para ocultarlo.</div></div>
      <div class="actions">${demo ? '' : '<button type="button" class="btn ghost" id="s-wipe">Borrar todo</button>'}<div class="r"><button type="button" class="btn ghost" data-close>Cancelar</button><button class="btn" type="submit">Guardar</button></div></div>
    </form>`, sh => {
    const wipe = sh.querySelector('#s-wipe');
    if (wipe) wipe.addEventListener('click', async () => {
      if (!wipe.dataset.armed) { wipe.dataset.armed = '1'; wipe.textContent = 'Borra todos tus datos. Toca otra vez'; wipe.className = 'btn danger'; return; }
      await store.clear(); closeSheet(); demo = true; S = demoS = makeDemo(); fmtCache = {}; render(); toast('Datos borrados');
    });
    sh.querySelector('#fs').addEventListener('submit', e => {
      e.preventDefault();
      S.settings = {...s, currency: sh.querySelector('#s-cur').value, patrimonio: readPat(sh.querySelector('#s-pat').value),
        metaAhorro: parseAmt(sh.querySelector('#s-meta').value), rendimiento: Math.min(30, parseAmt(sh.querySelector('#s-rend').value)),
        horasMes: parseAmt(sh.querySelector('#s-horas').value)};
      fmtCache = {}; commitMain(); closeSheet(); render(); toast(demo ? 'Ajustado en el ejemplo' : 'Guardado');
    });
  });
}

function openOnboarding() {
  openSheet(`
    <h2>Empecemos con lo tuyo</h2>
    <p class="note">Tres datos y ya ves tu rumbo. Lo demás lo completas cuando quieras.</p>
    <form id="fo" autocomplete="off">
      ${settingsFields({currency:'MXN', patrimonio:''})}
      <div class="field"><label for="o-ing">Tu ingreso fijo al mes</label><input id="o-ing" class="num" inputmode="decimal" placeholder="Sueldo neto, lo que te cae"></div>
      <div class="field"><label for="o-gas">Tus gastos fijos al mes</label><input id="o-gas" class="num" inputmode="decimal" placeholder="Renta, servicios, créditos…"><div class="hint">Un total por ahora. Después puedes separarlo en la pestaña Fijos.</div></div>
      <div class="actions"><div class="r"><button type="button" class="btn ghost" data-close>Seguir viendo el ejemplo</button><button class="btn" type="submit">Ver mi rumbo</button></div></div>
    </form>`, sh => {
    sh.querySelector('#fo').addEventListener('submit', async e => {
      e.preventDefault();
      const ing = parseAmt(sh.querySelector('#o-ing').value), gas = parseAmt(sh.querySelector('#o-gas').value);
      const old = S.movs;
      S = {settings:{...DEFAULT_SETTINGS, currency: sh.querySelector('#s-cur').value, patrimonio: readPat(sh.querySelector('#s-pat').value), onboarded:true},
           fijos:[], movs:[]};
      if (ing) S.fijos.push({id: uid(), nombre:'Sueldo', monto: ing, tipo:'ingreso', cat:'sueldo'});
      if (gas) S.fijos.push({id: uid(), nombre:'Gastos fijos', monto: gas, tipo:'gasto', cat:'casa'});
      demo = false; fmtCache = {}; ui.wi = {}; ui.wiExtra = 0;
      store.saveMain(); closeSheet(); location.hash = '#rumbo'; render(); toast('Listo. Ahora anota tus gastos con el +');
    });
  });
}

initStore();
})();
</script>
