<style>

*{box-sizing:border-box}
html,body{min-height:100%}

.btn.del{background:transparent;color:var(--rojo);box-shadow:none;padding:0 10px;font-weight:600;text-decoration:underline;text-underline-offset:4px}

.add{border:1.5px dashed var(--ink);background:transparent;border-radius:12px;min-height:48px;color:var(--ink);font:700 14px var(--body);text-align:left;padding:0 14px;width:100%}

.alert{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:12px 14px;border-radius:16px;background:var(--ambar-s);color:var(--ambar-t);font-size:14px}

.dt svg{width:20px;height:20px}
.grow{flex:1;min-width:0;display:flex;flex-direction:column}

.sh{display:flex;justify-content:space-between;align-items:baseline;margin-top:10px;padding:0 2px;gap:10px}
.bar{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}

.empty h3{color:var(--ink);font-size:18px;margin-bottom:6px}

.chart .lbl{fill:var(--mut);font-size:11px;font-family:var(--body)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--mut)}

.wi{display:flex;flex-direction:column;gap:2px}

.wi input{width:100%;accent-color:var(--azul-l);margin:0}
table.t{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
table.t th{font-size:12px;color:var(--mut);font-weight:600;text-align:right;padding:6px 0;border-bottom:1px solid var(--line)}

table.t th:first-child,table.t td:first-child{text-align:left}
.tablewrap{overflow-x:auto}

.f{display:flex;flex-direction:column;gap:6px;min-width:0}
.lab{font-size:13px;color:var(--mut);font-weight:500}
.inp{border:1px solid var(--line);background:var(--sup);border-radius:12px;height:48px;padding:0 14px;color:var(--ink);width:100%;min-width:0;font-size:16px}

const ocurr = (S, fijoId, ym) => S.ocurrencias.find(o => o.id === `${fijoId}_${ym}`);

function pendientes(S, h) {

}

  for (const f of fijosActivos(S).filter(f => f.tipo === 'ingreso')) for (const m of [ym, ymAdd(ym, 1)]) {
    const fe = fechaFijo(f.dia, m);

}

// MET-03
function infoMeta(S, m, h) {

  return {ap, meses, aporte, esteMes, falta: Math.max(0, aporte - esteMes), pct: m.monto ? Math.min(1, ap / m.monto) : 0, lista: aps};

// MET-05
function estadoMetas(S, h) {

// HOY-01..04
function calcHoy(S, h) {

  const prox = proximoIngreso(S, h);
  const limite = prox ? prox.fecha : iso(new Date(h.getFullYear(), h.getMonth() + 1, 1));
  const comp = [...pendientes(S, h), ...proximosFijos(S, h, limite)].filter(p => p.fijo.tipo === 'gasto' && (cuentaDe(S, p.fijo.cuentaId) || {}).diaADia);

// LIM-03/04 y DES: gastos del mes por categoría
function gastoMesCat(S, ym) {
  const r = {};
  for (const m of S.movs) {

    if (m.tipo === 'gasto') r[m.categoriaId] = (r[m.categoriaId] || 0) + bsMov(S, m);
    if (m.tipo === 'pago' && m.interes) r.intereses = (r.intereses || 0) + bsMov(S, m, m.interes);

}

// En rumbo.jviscafe.com (DAT-03, DAT-07): guarda en el servidor de Rumbo, detrás de Cloudflare Access. Las escrituras

    }

    clear: async () => encolar('DELETE', '/datos'),

    const onErr = () => { clearTimeout(timer); if (!loaded) { loaded = true; tomarDemo(); $('#banner').dataset.err = '1'; render(); } };
    mainRef.onSnapshot(s => { remote.main = s.exists ? s.data() : null; got.add('main'); sync(); }, onErr);
    COLS.forEach(c => refs[c].onSnapshot(q => { remote[c] = q.docs.map(d => ({...d.data(), id: d.id})); got.add(c); sync(); }, onErr));
    let chain = Promise.resolve(), pend = false;
    const fallo = () => toast('No se pudo guardar. Revisa tu conexión e intenta de nuevo.');
    store = {
      tipo: 'cloud',
      put: (c, o) => refs[c].doc(o.id).set(limpio(o)).catch(fallo),
      del: (c, i) => refs[c].doc(i).delete().catch(fallo),
      setAj: () => { if (pend) return; pend = true; chain = chain.then(async () => { pend = false; try { await mainRef.set({aj: limpio(S.aj)}); } catch (e) { fallo(); } }); },
      // Borrar: primero el documento principal (la base queda «sin empezar») y luego el resto
      clear: async () => { ocupado = true; try { try { await mainRef.delete(); } catch (e) {} for (const c of COLS) for (const o of [...(remote[c] || [])]) { try { await refs[c].doc(o.id).delete(); } catch (e) {} } } finally { ocupado = false; sync(); } },
      // Reemplazar sin pasar por «vacío»: borra solo lo que sobra, escribe lo nuevo y al final el principal
      reemplazar: async S2 => { ocupado = true; try {
        for (const c of COLS) { const quedan = new Set(S2[c].map(o => o.id)); for (const o of [...(remote[c] || [])]) if (!quedan.has(o.id)) { try { await refs[c].doc(o.id).delete(); } catch (e) {} } }
        for (const c of COLS) for (const o of S2[c]) { try { await refs[c].doc(o.id).set(limpio(o)); } catch (e) { fallo(); } }
        try { await mainRef.set({aj: limpio(S2.aj)}); } catch (e) { fallo(); }
      } finally { ocupado = false; sync(); } }
    };
  } else {
    clearTimeout(timer);
    store = storeLocal(); loaded = true;
    const i = store.inicial;
    if (i && i.aj && i.aj.empezado) { demo = false; S = {aj: {...AJ_BASE, ...i.aj}}; COLS.forEach(c => { S[c] = Array.isArray(i[c]) ? i[c] : []; }); }
    else tomarDemo();
    $('#banner').dataset.local = '1';
    render();
  }
}

function chartSVG(series, meses, marcas = []) {
  const W = 600, H = 250, L = 56, R = 14, T = 16, B = 30;
  const all = series.flatMap(s => s.data);
  let lo = Math.min(0, ...all), hi = Math.max(0, ...all); if (hi === lo) hi = lo + 1;
  const raw = (hi - lo) / 4, p = Math.pow(10, Math.floor(Math.log10(raw || 1))), f = raw / p;
  const step = (f < 1.5 ? 1 : f < 3 ? 2 : f < 7 ? 5 : 10) * p;
  lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step;
  const x = i => L + (W - L - R) * i / meses, y = v => T + (H - T - B) * (hi - v) / (hi - lo);
  let g = '';
  for (let v = lo; v <= hi + step / 2; v += step) {
    g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="${Math.abs(v) < 1e-9 ? 1.5 : 1}" ${Math.abs(v) < 1e-9 ? '' : 'stroke-dasharray="2 4"'}/>`;
    g += `<text class="lbl" x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${compact(v)}</text>`;
  }
  const años = meses / 12, paso = años <= 1 ? .25 : años <= 5 ? 1 : años <= 10 ? 2 : 5, h = hoy();
  for (let a = 0; a <= años + 1e-9; a += paso) {
    const i = Math.round(a * 12), d = new Date(h.getFullYear(), h.getMonth() + i, 1);
    const t = a === 0 ? 'Hoy' : años <= 1 ? MESES[d.getMonth()] : String(d.getFullYear());
    g += `<text class="lbl" x="${x(i)}" y="${H - 8}" text-anchor="${a === 0 ? 'start' : i === meses ? 'end' : 'middle'}">${t}</text>`;
  }
  for (const mk of marcas) if (mk.i > 0 && mk.i <= meses) {
    if (mk.tipo === 'linea') g += `<line x1="${x(mk.i)}" x2="${x(mk.i)}" y1="${T + 10}" y2="${H - B}" stroke="var(--ink)" stroke-dasharray="3 3" opacity=".45"/><text class="lbl" x="${Math.min(x(mk.i) + 5, W - 160)}" y="${T + 18}" fill="var(--ink)">${esc(mk.t)}</text>`;
    else g += `<rect x="${x(mk.i) - 4.5}" y="${H - B - 13}" width="9" height="9" rx="2" fill="var(--verde)"><title>${esc(mk.t)}</title></rect>`;
  }
  series.forEach(s => {
    const pts = s.data.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
    if (s.fill) g += `<polygon points="${x(0)},${y(Math.max(lo, 0))} ${pts} ${x(meses)},${y(Math.max(lo, 0))}" fill="${s.color}" opacity=".14"/>`;
    g += `<polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="${s.w || 3}" stroke-linejoin="round" stroke-linecap="round" ${s.dash ? 'stroke-dasharray="6 5"' : ''}/>`;
    g += `<circle cx="${x(meses)}" cy="${y(s.data[meses])}" r="5" fill="${s.color}" stroke="var(--bg)" stroke-width="2"/>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Proyección de tu patrimonio">${g}</svg>`;
}

    <div class="wi"><div class="ln"><label for="wi-extra">Ingreso extra al mes</label><output class="m sm" id="wo-extra">${money(ui.wiExtra, 0, true)}</output></div><input type="range" id="wi-extra" data-wi="__extra" min="0" max="${Math.max(5000, Math.round(R.ingreso * .5 / 500) * 500)}" step="250" value="${ui.wiExtra}"></div>

function vCategorias() {
  const fila = c => `<button class="row" data-act="editCat" data-id="${c.id}">${dt(c.icono, c.color)}<span class="grow"><span class="t">${esc(c.nombre)}</span><span class="xs m">${c.tipo === 'gasto' ? (c.tope > 0 ? `Tope ${money(c.tope)} al mes` : 'Sin tope') : 'Ingreso'}${c.archivada ? ' · archivada' : ''}</span></span><span class="m" aria-hidden="true">›</span></button>`;
  const g = S.categorias.filter(c => c.tipo === 'gasto'), i = S.categorias.filter(c => c.tipo === 'ingreso');
  return `<div class="top"><button class="ib" data-act="volver" aria-label="Volver">‹</button></div>
  <h1 class="h1">Categorías y topes</h1>
  <p class="note" style="margin:0">El tope cuenta los gastos del mes de calendario, incluidos los fijos confirmados. Lo que sobra no pasa al mes siguiente.</p>
  <div class="sh"><h2 class="h2">De gasto</h2></div><div class="rows">${g.map(fila).join('')}</div>
  <div class="sh"><h2 class="h2">De ingreso</h2></div><div class="rows">${i.map(fila).join('')}</div>
  <button class="add" data-act="nuevaCat">+ Agregar categoría</button>`;
}

  return `<div class="top"><button class="ib" data-act="volver" aria-label="Volver">‹</button></div>
  <h1 class="h1">Ajustes</h1>
  ${td != null && td > 7 ? `<section class="blk a"><span class="k">Tipo de cambio · hace ${td} días</span><span class="sm" style="opacity:.95">Lo pusiste el ${hoyCorto(st.tcFecha)}.${uc ? ` Tu último cambio real fue a Bs ${fmtN(uc.tc, 2)} el ${hoyCorto(uc.fecha)}.` : ''}</span></section>` : ''}
  <form class="card" id="fAjustes" autocomplete="off">
    <h2 class="h2">Dólares</h2>
    <div class="f"><label class="lab" for="a-tc">Tipo de cambio que usas (Bs por US$)</label><input class="inp" id="a-tc" inputmode="decimal" value="${fmtN(st.tc || 0, 2)}"><span class="xs m">${st.tcFecha ? `Puesto el ${hoyCorto(st.tcFecha)}.` : 'Todavía no lo pusiste.'}${uc ? ` Último cambio real: Bs ${fmtN(uc.tc, 2)} (${hoyCorto(uc.fecha)}).` : ''}</span></div>
    <h2 class="h2" style="margin-top:6px">Tu proyección</h2>
    <div class="f"><label class="lab" for="a-irr">Ingreso irregular que esperas al mes</label><input class="inp" id="a-irr" inputmode="decimal" value="${fmtN(st.irregular || 0)}"><span class="xs m">Tu promedio real de los últimos 3 meses: ${money(prom)}. Usa un número del que estés seguro: la proyección lo suma cada mes.</span></div>
    <div class="g2"><div class="f"><label class="lab" for="a-inf">Inflación anual %</label><input class="inp" id="a-inf" inputmode="decimal" value="${fmtN(st.inflacion || 0, 1).replace(',0', '')}"></div>
    <div class="f"><label class="lab" for="a-h">Horas de trabajo al mes</label><input class="inp" id="a-h" inputmode="numeric" value="${st.horas || ''}" placeholder="vacío oculta las horas"></div></div>
    <span class="xs m">El rendimiento se pone en cada cuenta, en Plan.</span>
    <div class="actions"><button class="btn" type="submit">Guardar</button></div>
  </form>
  <section class="card" aria-label="Apariencia"><h2 class="h2">Apariencia</h2>
    <div class="sm m">El color de tu dinero y de lo de hoy. Se ve igual en todos tus equipos.</div>
    <div class="chips" role="group" aria-label="Color principal">${Object.entries(PALETA).map(([id, p]) => `<button type="button" class="colorop" data-act="color" data-id="${id}" aria-pressed="${colorDe(st) === id}"><span style="background:${p.claro[0]}"></span>${p.nombre}</button>`).join('')}</div>
  </section>
  <section class="card"><h2 class="h2">Respaldo</h2>
    <div class="sm m">Un archivo con todas tus cuentas, movimientos, fijos, deudas y metas. Guárdalo donde quieras.</div>
    <div class="actions" style="justify-content:flex-start"><button class="btn" data-act="descargar"${demo ? ' disabled' : ''}>Descargar respaldo</button><label class="btn sec" for="cargarArchivo" style="cursor:pointer">Cargar respaldo</label><input type="file" id="cargarArchivo" accept=".json,application/json" hidden></div>
    ${demo ? '<span class="xs m">Estás viendo el ejemplo: empieza con tus datos para respaldar.</span>' : ''}
  </section>
  ${r ? (r.error ? `<div class="alert r"><span>${esc(r.error)}</span></div>` : `<section class="blk a"><span style="font-weight:600;font-size:16px">¿Reemplazar tus datos con este respaldo?</span>
    <span class="sm" style="opacity:.92">Trae ${r.conteo.cuentas} cuentas, ${r.conteo.movs} movimientos, ${r.conteo.fijos} fijos, ${r.conteo.deudas} deudas y ${r.conteo.metas} metas${r.fecha ? ` (del ${hoyCorto(r.fecha)})` : ''}. Lo que tienes ahora se borra.</span>
    <div class="actions"><button class="btn sec" data-act="cancelarRespaldo">Cancelar</button><button class="btn" data-act="aplicarRespaldo">Reemplazar mis datos</button></div></section>`) : ''}
  ${demo ? '' : `<section class="card"><h2 class="h2">Borrar todo</h2><div class="sm m">Borra todos tus datos y vuelve al ejemplo. Descarga un respaldo antes si lo quieres guardar.</div><div><button class="btn del" data-act="borrarTodo" style="padding:0">${ui.borrar ? 'Toca otra vez para borrar todo' : 'Borrar todo'}</button></div></section>`}`;
}

function render() {
  if (!loaded) return;
  aplicarColor();
  const v = vistaActual();
  document.querySelectorAll('nav.tabs a').forEach(a => a.setAttribute('aria-current', a.dataset.v === v && !ui.det ? 'page' : 'false'));
  $('#exTag').innerHTML = demo ? '<span class="ex">Datos de ejemplo</span>' : '';
  const b = $('#banner');
  b.innerHTML = demo ? `<div class="banner"><span><b>Esto es un ejemplo.</b> Nada se guarda hasta que empieces con tus datos.</span><button class="btn sm" data-act="empezar">Empezar con mis datos</button></div>${b.dataset.err ? '<div class="note">No pude abrir tus datos guardados en esta visita.</div>' : ''}`
    : (b.dataset.local ? '<div class="note">Tus datos se guardan solo en este navegador.</div>' : '');
  if (!ui.mes) ui.mes = ymOf(hoy());
  let html;
  const d = ui.det;
  if (d && d.tipo === 'deuda' && S.deudas.find(x => x.id === d.id)) html = vDeuda(S.deudas.find(x => x.id === d.id));
  else if (d && d.tipo === 'meta' && S.metas.find(x => x.id === d.id)) html = vMeta(S.metas.find(x => x.id === d.id));
  else if (d && d.tipo === 'categorias') html = vCategorias();
  else if (d && d.tipo === 'ajustes') html = vAjustes();
  else { ui.det = null; html = v === 'rumbo' ? vRumbo() : v === 'movimientos' ? vMovimientos() : v === 'desglose' ? vDesglose() : vPlan(); }
  $('#view').innerHTML = html;
}

/* ========== 7. Hojas y formularios ========== */
function openSheet(html, mount) {
  const root = $('#sheetRoot');
  root.innerHTML = `<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div></div>`;
  $('#scrim').addEventListener('click', e => { if (e.target.id === 'scrim') closeSheet(); });
  const sh = root.querySelector('.sheet');
  sh.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', closeSheet));
  if (mount) mount(sh);
}
function closeSheet() { $('#sheetRoot').innerHTML = ''; }
function toast(msg) { const d = document.createElement('div'); d.className = 'toast'; d.setAttribute('role', 'status'); d.textContent = msg; document.body.appendChild(d); setTimeout(() => d.remove(), 2600); }
const chipsCuentas = (sel, act, excluir, moneda) => activos(S.cuentas).filter(c => c.id !== excluir && (!moneda || c.moneda === moneda)).map(c => `<button type="button" class="chip" data-${act}="${c.id}" aria-pressed="${c.id === sel}">${esc(c.nombre)} · ${enMoneda(saldoCuenta(S, c), c.moneda)}</button>`).join('');
const chipsCats = (lista, sel) => lista.map(c => `<button type="button" class="chip" data-cat="${c.id}" aria-pressed="${c.id === sel}"><span class="sq" style="background:${c.id === sel ? 'var(--azul-on)' : c.color}"></span>${esc(c.nombre)}</button>`).join('');
const armarBorrar = (b, fn, txt = 'Toca otra vez para borrar') => b && b.addEventListener('click', () => { if (b.dataset.armed) fn(); else { b.dataset.armed = '1'; b.textContent = txt; } });
let ultimaCuenta = null; try { ultimaCuenta = localStorage.getItem('rumbo-ultima'); } catch (e) {}
const recordarCuenta = id => { ultimaCuenta = id; try { localStorage.setItem('rumbo-ultima', id); } catch (e) {} };

// MOV-01/02/03/05, CTA-06
function abrirAnotar(mov) {
  const h = hoy(); const cs = activos(S.cuentas);
  if (!cs.length) { toast('Primero crea una cuenta en Plan.'); return; }
  const def = (cs.find(c => c.id === ultimaCuenta) || cs.find(c => c.diaADia) || cs[0]).id;
  const st = mov ? {...mov} : {id: uid(), tipo: 'gasto', cuentaId: def, fecha: iso(h), nota: ''};
  if (!st.categoriaId && st.tipo !== 'transferencia') st.categoriaId = catsPorUso(S, st.tipo, h)[0]?.id;
  let usarTc = false;
  const leer = sh => { const q = id => sh.querySelector('#' + id); if (q('m-monto')) st.monto = parseAmt(q('m-monto').value); if (q('m-dest')) st.montoDestino = parseAmt(q('m-dest').value); if (q('m-nota')) st.nota = q('m-nota').value.trim(); if (q('m-fecha')) st.fecha = q('m-fecha').value || iso(h); };
  const cuerpo = () => {
    const c = cuentaDe(S, st.cuentaId) || cs[0], mon = c.moneda;
    if (st.tipo === 'transferencia') {
      const destinos = cs.filter(x => x.id !== st.cuentaId); if (!destinos.find(x => x.id === st.cuentaDestinoId)) st.cuentaDestinoId = destinos[0] ? destinos[0].id : null;
      const d = cuentaDe(S, st.cuentaDestinoId), distinta = d && d.moneda !== mon;
      const tc = distinta && st.monto && st.montoDestino ? (mon === 'BOB' ? st.monto / st.montoDestino : st.montoDestino / st.monto) : null;
      return `<div class="f"><span class="lab">Desde</span><div class="chips">${chipsCuentas(st.cuentaId, 'desde')}</div></div>
      <div class="montoblk"><label for="m-monto">Sale de ${esc(c.nombre)}</label><div class="r"><span>${mon === 'USD' ? 'US$' : 'Bs'}</span><input id="m-monto" inputmode="decimal" placeholder="0" value="${st.monto ? fmtN(st.monto, st.monto % 1 ? 2 : 0) : ''}"></div></div>
      <div class="f"><span class="lab">Hacia</span><div class="chips">${destinos.length ? chipsCuentas(st.cuentaDestinoId, 'hacia', st.cuentaId) : '<span class="xs m">Necesitas otra cuenta para transferir.</span>'}</div></div>
      ${distinta ? `<div class="montoblk v"><label for="m-dest">Entra a ${esc(d.nombre)} · escribe lo que recibiste</label><div class="r"><span>${d.moneda === 'USD' ? 'US$' : 'Bs'}</span><input id="m-dest" inputmode="decimal" placeholder="0" value="${st.montoDestino ? fmtN(st.montoDestino, st.montoDestino % 1 ? 2 : 0) : ''}"></div></div>` : ''}
      <div class="card" style="gap:4px;padding:12px 14px;font-size:14px" id="m-tc">${tc ? `<span>Este cambio fue a <b>Bs ${fmtN(tc, 2)} por dólar</b>.</span><label class="xs m" style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="m-usartc" ${usarTc ? 'checked' : ''}> Usar Bs ${fmtN(tc, 2)} como mi tipo de cambio</label>` : ''}<span class="xs m">No cuenta como gasto ni ingreso: tu dinero solo cambia de lugar.</span></div>
      <div class="g2"><div class="f"><label class="lab" for="m-nota">Nota</label><input class="inp" id="m-nota" value="${esc(st.nota)}" maxlength="60"></div><div class="f"><label class="lab" for="m-fecha">Fecha</label><input class="inp" id="m-fecha" type="date" value="${st.fecha}"></div></div>`;
    }
    const lista = catsPorUso(S, st.tipo, h); const sug = notasSugeridas(S, st.categoriaId);
    return `<div class="montoblk"><label for="m-monto">Monto</label><div class="r"><span>${mon === 'USD' ? 'US$' : 'Bs'}</span><input id="m-monto" inputmode="decimal" placeholder="0" value="${st.monto ? fmtN(st.monto, st.monto % 1 ? 2 : 0) : ''}"></div><span class="xs" id="m-tope" style="opacity:.92"></span></div>
    <div class="f"><span class="lab">Cuenta${mov ? '' : ' · la última que usaste'}</span><div class="chips">${chipsCuentas(st.cuentaId, 'cuenta')}</div></div>
    <div class="f"><span class="lab">Categoría · primero las que más usas</span><div class="chips">${chipsCats(lista, st.categoriaId)}</div></div>
    <div class="g2"><div class="f"><label class="lab" for="m-nota">Nota</label><input class="inp" id="m-nota" value="${esc(st.nota)}" maxlength="60" placeholder="Opcional"></div><div class="f"><label class="lab" for="m-fecha">Fecha</label><input class="inp" id="m-fecha" type="date" value="${st.fecha}"></div></div>
    ${sug.length ? `<div class="chips"><span class="xs m" style="align-self:center">Sugeridas:</span>${sug.map(n => `<button type="button" class="chip" data-nota="${esc(n)}" style="height:34px;font-size:13px">${esc(n)}</button>`).join('')}</div>` : ''}`;
  };
  const avisoTope = sh => {
    const el = sh.querySelector('#m-tope'); if (!el || st.tipo !== 'gasto') return;
    const c = catDe(S, st.categoriaId), monto = parseAmt(sh.querySelector('#m-monto').value);
    if (!(c.tope > 0) || !monto) { el.textContent = ''; return; }
    const ym = (sh.querySelector('#m-fecha').value || iso(h)).slice(0, 7);
    const t = avanceTopes(S.movs.some(m => m.id === st.id) ? {...S, movs: S.movs.filter(m => m.id !== st.id)} : S, ym, {cat: c.id, monto: aBs(S, monto, monedaDe(S, st.cuentaId))}).find(x => x.cat.id === c.id);
    el.textContent = t && t.pct >= 0.8 ? `${c.nombre}: después de esto llevas ${Math.round(t.pct * 100)} % de tu tope` : '';
  };
  const pintar = sh => {
    sh.querySelector('#m-body').innerHTML = cuerpo();
    sh.querySelectorAll('[data-tipo]').forEach(b => b.setAttribute('aria-pressed', b.dataset.tipo === st.tipo));
    avisoTope(sh);
  };
  openSheet(`<div class="sp"><h2 class="h2" style="font-size:20px">${mov ? 'Editar movimiento' : 'Anotar'}</h2>${demo ? '<span class="ex">Ejemplo: no se guarda</span>' : ''}</div>
    <form id="fMov" autocomplete="off" style="display:flex;flex-direction:column;gap:14px">
      <div class="seg full" role="group" aria-label="Tipo">${['gasto', 'ingreso', 'transferencia'].map(t => `<button type="button" data-tipo="${t}" aria-pressed="${st.tipo === t}">${t[0].toUpperCase() + t.slice(1)}</button>`).join('')}</div>
      <div id="m-body" style="display:flex;flex-direction:column;gap:14px"></div>
      ${mov && mov.tipo === 'gasto' ? '<button type="button" class="btn sec" id="m-sep" style="align-self:flex-start;padding:0">Me deben una parte</button>' : ''}
      <div class="actions">${mov ? '<button type="button" class="btn del izq" id="m-del">Borrar</button>' : ''}<button type="button" class="btn sec" data-close>Cancelar</button><button class="btn" type="submit">Guardar</button></div>
    </form>`, sh => {
    pintar(sh); setTimeout(() => { const i = sh.querySelector('#m-monto'); if (i && !mov) i.focus(); }, 60);
    sh.addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return;
      if (b.dataset.tipo) { leer(sh); if (st.tipo !== b.dataset.tipo) { st.tipo = b.dataset.tipo; st.categoriaId = st.tipo === 'transferencia' ? null : catsPorUso(S, st.tipo, h)[0]?.id; } pintar(sh); }
      else if (b.dataset.cuenta || b.dataset.desde) { leer(sh); st.cuentaId = b.dataset.cuenta || b.dataset.desde; pintar(sh); }
      else if (b.dataset.hacia) { leer(sh); st.cuentaDestinoId = b.dataset.hacia; pintar(sh); }
      else if (b.dataset.cat) { leer(sh); st.categoriaId = b.dataset.cat; pintar(sh); }
      else if (b.dataset.nota) { sh.querySelector('#m-nota').value = b.dataset.nota; }
    });
    sh.addEventListener('input', e => {
      if (e.target.id === 'm-usartc') { usarTc = e.target.checked; return; }
      if (e.target.id === 'm-monto' || e.target.id === 'm-dest') { if (st.tipo === 'transferencia') { leer(sh); const tcBox = sh.querySelector('#m-tc'); const c = cuentaDe(S, st.cuentaId), d = cuentaDe(S, st.cuentaDestinoId); if (tcBox && d && c && d.moneda !== c.moneda && st.monto && st.montoDestino) { const tc = c.moneda === 'BOB' ? st.monto / st.montoDestino : st.montoDestino / st.monto; tcBox.innerHTML = `<span>Este cambio fue a <b>Bs ${fmtN(tc, 2)} por dólar</b>.</span><label class="xs m" style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="m-usartc" ${usarTc ? 'checked' : ''}> Usar Bs ${fmtN(tc, 2)} como mi tipo de cambio</label><span class="xs m">No cuenta como gasto ni ingreso: tu dinero solo cambia de lugar.</span>`; } } else avisoTope(sh); }
    });
    armarBorrar(sh.querySelector('#m-del'), () => { borrarMov(mov.id); closeSheet(); render(); toast('Movimiento borrado'); });
    const sep = sh.querySelector('#m-sep'); if (sep) sep.addEventListener('click', () => abrirSeparar(S.movs.find(x => x.id === mov.id) || mov));
    sh.querySelector('#fMov').addEventListener('submit', e => {
      e.preventDefault(); leer(sh);
      if (!st.monto || st.monto <= 0) { toast('Escribe un monto'); return; }
      const m = {id: st.id, tipo: st.tipo, cuentaId: st.cuentaId, monto: r2(st.monto), nota: st.nota, fecha: st.fecha};
      if (mov && mov.fijoId) { m.fijoId = mov.fijoId; m.mes = mov.mes; }
      if (mov && mov.tc != null) m.tc = mov.tc;
      if (st.tipo === 'transferencia') {
        if (!st.cuentaDestinoId || st.cuentaDestinoId === st.cuentaId) { toast('La cuenta de origen y la de destino deben ser distintas'); return; }
        m.cuentaDestinoId = st.cuentaDestinoId;
        const c = cuentaDe(S, st.cuentaId), d = cuentaDe(S, st.cuentaDestinoId);
        if (c.moneda !== d.moneda) { if (!st.montoDestino) { toast('Escribe cuánto recibiste'); return; } m.montoDestino = r2(st.montoDestino);
          if (usarTc) { S.aj.tc = r2(c.moneda === 'BOB' ? m.monto / m.montoDestino : m.montoDestino / m.monto); S.aj.tcFecha = iso(h); guardarAj(); } }
      } else m.categoriaId = st.categoriaId;
      put('movs', m); recordarCuenta(st.cuentaId); closeSheet(); render();
      const previa = [m.cuentaId, m.cuentaDestinoId].map(id => cuentaDe(S, id)).find(c => c && antes(c, m)); // CTA-07
      toast(previa ? `Es de antes de abrir ${previa.nombre}: cuenta en el Desglose, pero no cambia su saldo` : mov ? 'Guardado' : st.tipo === 'gasto' ? 'Gasto anotado' : st.tipo === 'ingreso' ? 'Ingreso anotado' : 'Transferencia anotada');
    });

async function descargar() {

      document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    } catch (e) { toast('No se pudo descargar el respaldo.'); }
    return;
  }
  try { await dl.save({filename, data}); }

}

  verDeuda: b => { ui.det = {tipo: 'deuda', id: b.dataset.id}; ui.adel = 0; render(); scrollTo(0, 0); },
  pagoDeuda: b => abrirPago(S.deudas.find(d => d.id === b.dataset.id), b.dataset.tipo),
  nuevaMeta: () => abrirMeta(null), editMeta: b => abrirMeta(S.metas.find(m => m.id === b.dataset.id)),
  verMeta: b => { ui.det = {tipo: 'meta', id: b.dataset.id}; ui.metaCuenta = null; render(); scrollTo(0, 0); },
  metaCuenta: b => { const v = $('#ap-monto') && $('#ap-monto').value; ui.metaCuenta = b.dataset.id; render(); if (v) $('#ap-monto').value = v; },
  apartar: b => apartar(b.dataset.id, +b.dataset.signo),
  verCategorias: () => { ui.det = {tipo: 'categorias'}; render(); scrollTo(0, 0); },
  nuevaCat: () => abrirCategoria(null), editCat: b => abrirCategoria(S.categorias.find(c => c.id === b.dataset.id)),
  volver: () => { ui.det = null; render(); },
  color: b => { if (!PALETA.hasOwnProperty(b.dataset.id)) return; S.aj.color = b.dataset.id; guardarAj(); aplicarColor();
    document.querySelectorAll('[data-act="color"]').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.id === b.dataset.id))); },
  descargar: () => descargar(),
  cancelarRespaldo: () => { ui.respaldo = null; render(); },
  aplicarRespaldo: async () => { const r = ui.respaldo; if (!r || !r.S) return; r.S.aj.empezado = true; demo = false; S = r.S; ui.respaldo = null; ui.det = null; render(); toast('Respaldo cargado'); await store.reemplazar(S); },
  borrarTodo: async () => { if (!ui.borrar) { ui.borrar = true; render(); return; } ui.borrar = false; await store.clear(); demoS = null; tomarDemo(); ui.det = null; render(); toast('Tus datos se borraron'); }
};
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || !acciones[b.dataset.act]) return;
  if (b.tagName === 'A' && b.getAttribute('href') === '#') e.preventDefault();
  acciones[b.dataset.act](b);
});
function parcheRumbo() {
  const tmp = document.createElement('div'); tmp.innerHTML = vRumbo();
  ['#chartBox', '#legend', '#wiRes'].forEach(s => { const a = document.querySelector('#view ' + s), n = tmp.querySelector(s); if (a && n) a.innerHTML = n.innerHTML; });
  tmp.querySelectorAll('output').forEach(o => { const a = document.getElementById(o.id); if (a) a.textContent = o.textContent; });
}
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.wi) { const v = +t.value; if (t.dataset.wi === '__extra') ui.wiExtra = v; else if (t.dataset.wi === '__adel') ui.wiAdel = v; else ui.wi[t.dataset.wi] = v; parcheRumbo(); }
  else if (t.dataset.adel) { ui.adel = +t.value; const tmp = document.createElement('div'); const d = S.deudas.find(x => ui.det && x.id === ui.det.id); if (!d) return; tmp.innerHTML = vDeuda(d); $('#adelOut').textContent = tmp.querySelector('#adelOut').textContent; $('#adelRes').innerHTML = tmp.querySelector('#adelRes').innerHTML; }
});
document.addEventListener('submit', e => {
  if (e.target.id !== 'fAjustes') return; e.preventDefault();
  const q = id => document.getElementById(id); const tc = parseAmt(q('a-tc').value);
  if (tc && Math.abs(tc - (S.aj.tc || 0)) > 0.0001) { S.aj.tc = tc; S.aj.tcFecha = iso(hoy()); } else if (tc && !S.aj.tcFecha) S.aj.tcFecha = iso(hoy());
  S.aj.irregular = parseAmt(q('a-irr').value); S.aj.inflacion = parseAmt(q('a-inf').value); S.aj.horas = parseInt(q('a-h').value, 10) || 0;
  guardarAj(); render(); toast(demo ? 'Ajustado en el ejemplo' : 'Guardado');
});
document.addEventListener('change', e => {
  if (e.target.id !== 'cargarArchivo' || !e.target.files[0]) return;
  const fr = new FileReader(); fr.onload = () => { ui.respaldo = leerRespaldo(String(fr.result)); render(); }; fr.readAsText(e.target.files[0]);
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });
window.addEventListener('hashchange', () => { ui.det = null; render(); scrollTo(0, 0); });

iniciarStore();
})();
</script>
