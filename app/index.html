<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="Rumbo: a dónde te llevan tus ingresos y gastos.">
    <meta name="rumbo-api" content="/api/v2">
    <!-- PAN-10: installable on the phone. The manifest goes with credentials so it carries the Cloudflare Access cookie -->
    <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials">
    <link rel="icon" type="image/png" href="/iconos/icono-192.png">
    <link rel="apple-touch-icon" href="/iconos/icono-180.png">
    <meta name="theme-color" content="#EDF0EA" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0E1411" media="(prefers-color-scheme: dark)">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Rumbo">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>Rumbo</title>
    <!-- The data are asked for while the code loads; almacen-servidor.ts takes this first answer -->
    <script>window.__rumboDatos = fetch('/api/v2/datos', { cache: 'no-store', credentials: 'same-origin', redirect: 'manual' });</script>
    <!-- The fonts go with the app and are asked for at once, next to the code (estilos.css, decision 77) -->
    <link rel="preload" href="/src/presentacion/react/fuentes/bricolage-grotesque-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/src/presentacion/react/fuentes/instrument-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
  </head>
  <body>
    <div id="raiz"></div>
    <script type="module" src="/src/composicion/main.tsx"></script>
  </body>
</html>
