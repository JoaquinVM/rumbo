# Cloudflare tunnel of the apps on jviscafe.com (PUB-01, PUB-02, docs/DESPLIEGUE.md). It is not Akhana's tunnel: it
# has its own token and lives only on the `apps` network, so it reaches the apps (Rumbo as http://rumbo:8080) and
# never Akhana's containers. Run once with:
#   docker compose -p apps-tunel -f deploy/tunel/docker-compose.yml --env-file /opt/apps/tunel/.env up -d
# The /ready of its metrics (port 2000, no published port) tells deploy-watch.sh whether it is connected.

services:
  cloudflared:
    image: cloudflare/cloudflared:2026.10.7
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "--metrics", "0.0.0.0:2000", "run"]
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?TUNNEL_TOKEN no está en /opt/apps/tunel/.env}
    networks:
      apps:
        aliases: [tunel]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 200
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.25
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  apps:
    external: true
    name: apps
