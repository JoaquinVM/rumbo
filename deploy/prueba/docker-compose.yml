# Rumbo 2's test environment (PUB-07, docs/DESPLIEGUE.md «Ambiente de prueba»): rumbo-prueba.jviscafe.com, while
# Rumbo 2 is built. Run through prueba.sh as the compose project `rumbo-prueba`. It never touches rumbo.jviscafe.com:
# its own container, its own database (`rumbo2_prueba`, its own role) in Rumbo's Postgres, reached on Rumbo's internal
# network, and its own Access application. The tunnel reaches it as `rumbo-prueba` on the `apps` network. With it, the
# limits of Rumbo's containers add up to 1 GiB (PUB-02): db 384, app 256, tunnel 128 and this one 256.

services:
  prueba:
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 200
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    build:
      context: ../..
      dockerfile: deploy/Dockerfile.v2
      labels:
        jviscafe.app: rumbo-prueba
    image: rumbo-prueba-app
    read_only: true
    environment:
      PGHOST: db
      PGUSER: rumbo2_prueba
      PGPASSWORD: ${DB_PASSWORD:?DB_PASSWORD no está en el .env}
      PGDATABASE: rumbo2_prueba
      ACCESS_TEAM: ${ACCESS_TEAM:?ACCESS_TEAM no está en el .env}
      ACCESS_AUD: ${ACCESS_AUD:?ACCESS_AUD no está en el .env (la aplicación de Access de rumbo-prueba)}
      CORREOS_PERMITIDOS: ${CORREOS_PERMITIDOS:?CORREOS_PERMITIDOS no está en el .env}
      TZ: ${TZ:-America/La_Paz}
    networks:
      interna: {}
      apps:
        aliases: [rumbo-prueba]
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:8080/salud"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s

networks:
  interna:
    external: true
    name: rumbo_interna
  apps:
    external: true
    name: apps
